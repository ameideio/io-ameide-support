name: Publish Ameide Support image

on:
  push:
    branches:
      - develop
      - feat/**
      - fix/**
      - chore/**
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_REPO: ghcr.io/ameideio/io-ameide-support

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Prepare
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          cp docker/Dockerfile /tmp/io-ameide-support.Dockerfile
          printf '\nENV CW_EDITION="ce"\n' >> /tmp/io-ameide-support.Dockerfile

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: /tmp/io-ameide-support.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Generate SLSA build-provenance attestation (per-platform digest)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ${{ vars.AMEIDE_DIND_RUNS_ON }}
    needs: build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
      primary_tag: ${{ steps.manifest.outputs.primary_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Create manifest list and push
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          sanitized_ref="$(echo "$GIT_REF" | tr '/' '-')"
          short_sha="$(printf '%s' "$GIT_SHA" | cut -c1-12)"
          primary_tag="${IMAGE_REPO}:${sanitized_ref}-ce"
          tags=(
            "${primary_tag}"
            "${IMAGE_REPO}:sha-${short_sha}-ce"
          )

          # Kargo (Digest strategy) expects a stable, mutable channel tag (e.g., `main`) that
          # resolves to the latest desired revision. This repo's default branch is `develop`,
          # so we additionally publish `:main` tags on `develop` builds.
          if [ "${sanitized_ref}" = "develop" ]; then
            tags+=(
              "${IMAGE_REPO}:main"
              "${IMAGE_REPO}:main-${short_sha}"
            )
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags+=("${IMAGE_REPO}:${GIT_REF}-ce")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf '${{ env.IMAGE_REPO }}@sha256:%s ' *)

          # Resolve the digest of the freshly-pushed manifest list so downstream
          # steps (SBOM, attestation) can pin to it.
          manifest_digest="$(docker buildx imagetools inspect "${primary_tag}" --raw | sha256sum | awk '{print "sha256:"$1}')"
          # Prefer registry-reported digest when available.
          if registry_digest="$(docker buildx imagetools inspect "${primary_tag}" --format '{{ json .Manifest }}' | jq -r '.digest')" && [ -n "$registry_digest" ] && [ "$registry_digest" != "null" ]; then
            manifest_digest="$registry_digest"
          fi
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${primary_tag}" >> "$GITHUB_OUTPUT"

      - name: Inspect published image
        env:
          PRIMARY_TAG: ${{ steps.manifest.outputs.primary_tag }}
        run: docker buildx imagetools inspect "${PRIMARY_TAG}"

      - name: Generate SBOM (SPDX JSON) for published image
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.manifest.outputs.primary_tag }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Attach SBOM as OCI sidecar artifact
        env:
          PRIMARY_TAG: ${{ steps.manifest.outputs.primary_tag }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
          SBOM_PATH: ${{ runner.temp }}/sbom.spdx.json
        run: |
          set -euo pipefail
          # Pin to immutable digest to ensure the SBOM is bound to exactly this build.
          # cosign 2.x rejects --type spdxjson; valid values are
          # spdx|cyclonedx|syft. anchore/sbom-action emits SPDX-JSON,
          # which is fine — `--type spdx` declares the format and the
          # JSON encoding is detected automatically.
          cosign attach sbom \
            --sbom "${SBOM_PATH}" \
            --type spdx \
            "${IMAGE_REPO}@${MANIFEST_DIGEST}"

      - name: Generate SLSA build-provenance attestation (manifest list)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
